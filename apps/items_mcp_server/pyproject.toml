[project]
name = "items-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PatchFramework", email = "dominic.viola@online.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4",
    "openai>=2.42.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
]

[project.scripts]
items-mcp-server = "items_mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
