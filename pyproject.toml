[project]
name = "ai-engineering-bootcamp-prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.52.2",
    "torch>=2.12.1",
    "psycopg[binary]>=3.3.4",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/chatbot_ui",
    "apps/items_mcp_server",
    "apps/reviews_mcp_server",
]

[dependency-groups]
dev = [
    "fastmcp>=3.4.4",
    "instructor>=1.15.3",
    "langchain-community>=0.4.0,<0.4.2",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.1.9",
    "langgraph>=1.2.2",
    "langsmith>=0.8.16",
    "matplotlib>=3.11.0",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
]

