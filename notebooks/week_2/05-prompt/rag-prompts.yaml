metadata:
  name: "shopping-assistent-rag"
  description: Prompts that make it possible to retrieve product information from etracted context
  author: "Dominic"
  version: "1.0"

prompts:
  rag-prompt-products: |
    You are a helpful shopping assistant.

    Use the following context to answer the question.

    Context:
    {{ context }}

    Question:
    {{ question }}

    Instructions:
    - Answer based on the context only
    - Do not answer outside of the context
    - Do not use markdown formatting
    - Do not use word "context" in the answer
